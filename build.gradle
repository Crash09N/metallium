plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'metallium'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Sodium is optional at runtime; compiled against for the options page.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"

	include(implementation("io.github.kokodio:metal-jvm:${project.metal_jvm_version}"))

	// Release jar: metallium-gl (Apache-2.0) and the Iris adapter (LGPL-3.0, stays a separate nested jar) are jar-in-jar.
	// Both are inert unless needed (see IrisSupport / GlRouting), so the one jar is safe to install anywhere.
	include project(':metallium-gl')
	include project(':metallium-iris')

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// shaderc / SPIRV-Cross natives for unit tests (the game provides them at runtime).
	['natives-linux', 'natives-macos-arm64', 'natives-macos'].each { classifier ->
		testRuntimeOnly "org.lwjgl:lwjgl:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-spvc:3.4.3:${classifier}"
	}
}

test {
	useJUnitPlatform()
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE')
	from('NOTICE')
	from('LICENSES') { into 'LICENSES' }
}

// Standalone Metal smoke test (no Minecraft): ./gradlew metalSmokeTest  — macOS only.
sourceSets {
	smoketest {
		java.srcDir 'src/smoketest/java'
	}
}

dependencies {
	smoketestImplementation "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"
}

tasks.register('metalSmokeTest', JavaExec) {
	group = 'verification'
	description = 'Creates a Metal device, renders offscreen and checks the result (macOS only).'
	classpath = sourceSets.smoketest.runtimeClasspath
	mainClass = 'dev.metallium.smoketest.MetalSmokeTest'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Client game tests (real game, real window): ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'metallium-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom.runs.clientGameTest {
	vmArg '-Xmx4G'
	vmArg '--enable-native-access=ALL-UNNAMED'
	vmArg "-Dmetallium.gametest.expectBackend=${System.getenv('METALLIUM_EXPECT_BACKEND') ?: ''}"
	if (project.hasProperty('bench')) vmArg '-Dmetallium.gametest.mode=bench'
	if (project.hasProperty('engine')) vmArg "-Dmetallium.engine=${project.property('engine')}"
	if (project.hasProperty('backendOff')) vmArg '-Dmetallium.backend=off'
	// -Pshaderpack=/abs/path/pack.zip (with -PwithIris): also load that pack in the game test. Copied into the run
	// directory at runtime only; never commit third-party packs.
	if (project.hasProperty('shaderpack')) vmArg "-Dmetallium.gametest.shaderpack=${project.property('shaderpack')}"
	// -PshaderpackOptions=COLORED_LIGHTING=128,FOO=1: pack options for that pack (written to Iris's <pack>.txt).
	// -PirisHideMacOs=false: packs see MC_OS_MAC on Metal again (hidden by default, config irisHideMacOs; they gate
	// compute/voxel features on it; see iris-stage5-compute.md). -PirisHideMacOs alone = true.
	if (project.hasProperty('irisHideMacOs')) vmArg "-Dmetallium.iris.hideMacOs=${project.property('irisHideMacOs') ?: 'true'}"
	if (project.hasProperty('shaderpackOptions')) vmArg "-Dmetallium.gametest.shaderpackOptions=${project.property('shaderpackOptions')}"
	if (project.hasProperty('benchSeconds')) vmArg "-Dmetallium.bench.seconds=${project.property('benchSeconds')}"
	if (project.hasProperty('benchScene')) vmArg "-Dmetallium.bench.scene=${project.property('benchScene')}"
	// -PbenchScene=voxy: vanilla rd during the measurement (-PvoxyRd, default 4) and Voxy's LOD distance (-PvoxyDistance)
	if (project.hasProperty('voxyRd')) vmArg "-Dmetallium.bench.voxyRd=${project.property('voxyRd')}"
	// -PglIcbTextures=false: textured indirect-count draws use metallium-gl's per-slot fallback instead of ICBs (A/B)
	if (project.hasProperty('glIcbTextures')) vmArg "-Dmetallium.gl.icbTextures=${project.property('glIcbTextures')}"
	if (project.hasProperty('voxyDistance')) vmArg "-Dmetallium.bench.voxyDistance=${project.property('voxyDistance')}"
	// -PbenchRd=N: override the benchmark scene's render distance (default 12, rd32 scene 32).
	if (project.hasProperty('benchRd')) vmArg "-Dmetallium.bench.renderDistance=${project.property('benchRd')}"
	// -PbenchSettleSeconds=N: wall-clock settle time before recording.
	if (project.hasProperty('benchSettleSeconds')) vmArg "-Dmetallium.bench.settleSeconds=${project.property('benchSettleSeconds')}"
	// -Pterrain=key=value,key2=value2: Metallium terrain options as -Dmetallium.terrain.<key>=<value> (A/B benchmarks).
	if (project.hasProperty('terrain')) {
		project.property('terrain').toString().split(',').each { opt -> if (!opt.isEmpty()) vmArg "-Dmetallium.terrain.${opt}" }
	}
	if (project.hasProperty('perfCounters')) vmArg '-Dmetallium.perfCounters=true'
	// -PperfTrace (with -PperfCounters): log every encoder of one submit per counter window and why it was opened.
	if (project.hasProperty('perfTrace')) vmArg '-Dmetallium.perfTrace=true'
	// -PglMods=voxy (with -PwithGl): retarget these mods' GL calls to metallium-gl; -PglFailFast=false logs instead of throwing.
	if (project.hasProperty('glMods')) vmArg "-Dmetallium.gl.mods=${project.property('glMods')}"
	if (project.hasProperty('glFailFast')) vmArg "-Dmetallium.gl.failFast=${project.property('glFailFast')}"
	// -PglTrace=N [-PglTraceAfter=S]: log N metallium-gl device operations after S seconds (diagnostics).
	if (project.hasProperty('glTrace')) vmArg "-Dmetallium.gl.trace=${project.property('glTrace')}"
	if (project.hasProperty('glTraceAfter')) vmArg "-Dmetallium.gl.traceAfter=${project.property('glTraceAfter')}"
	// -PvoxyScenario: run the Voxy camera scenario without Voxy (reference screenshots).
	if (project.hasProperty('voxyScenario')) vmArg '-Dmetallium.gametest.voxyScenario=true'
	if (project.hasProperty('glDump')) vmArg "-Dmetallium.gl.dump=${project.property('glDump')}"
	if (project.hasProperty('benchPower')) vmArg '-Dmetallium.bench.power=true'
	// A crashed earlier test run must not put the next one into crash-recovery mode (OpenGL + dialog).
	vmArg "-Dmetallium.crashRecovery=${project.hasProperty('crashRecovery') ? 'on' : 'off'}"
	if (project.hasProperty('playSeconds')) vmArg "-Dmetallium.gametest.playSeconds=${project.property('playSeconds')}"
	// The run directory is recreated for every game test, so keep the shader cache next to it: the second run is warm.
	// -PshaderCache=false disables it; delete that directory for a cold run.
	vmArg "-Dmetallium.shaderCache.dir=${layout.buildDirectory.get().asFile}/run/metallium-shader-cache"
	if (project.hasProperty('shaderCache')) vmArg "-Dmetallium.shaderCache=${project.property('shaderCache')}"
	// -PshaderDump=/abs/dir: write every compiled MSL source (and compute GLSL) there (diagnostics).
	if (project.hasProperty('shaderDump')) vmArg "-Dmetallium.shaderDump=${project.property('shaderDump')}"
	// -PbenchBiome=minecraft:ocean: bench camera just above sea level in the nearest such biome.
	if (project.hasProperty('benchBiome')) vmArg "-Dmetallium.bench.biome=${project.property('benchBiome')}"
	// -PbenchWindow=2560x1440: benchmark window size (default: the game test's 854x480).
	if (project.hasProperty('benchWindow')) vmArg "-Dmetallium.bench.window=${project.property('benchWindow')}"
	// -PbenchVsync: run the benchmark with VSync on (default off) to compare presented vs rendered frames.
	if (project.hasProperty('benchVsync')) vmArg '-Dmetallium.bench.vsync=true'
	// -PbenchDisplay=<index or name substring>: display for the benchmark window (default: highest refresh rate).
	if (project.hasProperty('benchDisplay')) vmArg "-Dmetallium.bench.display=${project.property('benchDisplay')}"
	// -PbenchFullscreen: benchmark fullscreen on that display.
	if (project.hasProperty('benchFullscreen')) vmArg '-Dmetallium.bench.fullscreen=true'
	// -PpresentPacing=gpu: VSync-off present pacing on GPU completion + half refresh (default: presented handler).
	// -PmetalHud: Apple's Metal Performance HUD in the game window (+ its unified-log metrics, MTL_HUD_LOG_ENABLED).
	if (project.hasProperty('metalHud')) {
		environmentVariable 'MTL_HUD_ENABLED', '1'
		environmentVariable 'MTL_HUD_LOG_ENABLED', '1'
	}
	if (project.hasProperty('presentPacing')) vmArg "-Dmetallium.present.pacing=${project.property('presentPacing')}"
}

// ./gradlew runClientGameTest -PwithSodium  → runs the game tests with Sodium loaded.
if (project.hasProperty('withSodium')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		// also for ./gradlew runClient -PwithSodium (dev runtime only, not published)
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
}

// ./gradlew runClientGameTest -PwithIris  → Sodium + Iris + the Metallium Iris adapter.
if (project.hasProperty('withIris')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		gametestRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
		gametestRuntimeOnly project(':metallium-iris')
		// also for ./gradlew :runClient -PwithIris (dev runtime only)
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
		localRuntime "maven.modrinth:iris:${project.iris_version}"
		localRuntime project(':metallium-iris')
	}
}

// ./gradlew runClientGameTest -PwithGl  → also loads metallium-gl; the gametest's raw-GL test mod is retargeted to Metal.
if (project.hasProperty('withGl')) {
	dependencies {
		gametestRuntimeOnly project(':metallium-gl')
		localRuntime project(':metallium-gl')
	}
}

// ./gradlew runClientGameTest -Pinstance[=/abs/run/dir]  → real-instance stress test: run directory run-instance/ (built by
// tools/make-run-instance.sh from a real Minecraft instance; git-ignored). Its own Sodium, Iris and other mods load from
// run-instance/mods; the dev Metallium, metallium-iris and metallium-gl come from this build. Do not combine with
// -PwithSodium/-PwithIris (duplicate mods). -PinstancePacks=a.zip,b.zip limits the shader packs.
if (project.hasProperty('instance')) {
	if (project.hasProperty('withSodium') || project.hasProperty('withIris')) {
		throw new GradleException('-Pinstance loads Sodium/Iris from the instance; do not add -PwithSodium/-PwithIris')
	}
	dependencies {
		gametestRuntimeOnly project(':metallium-iris')
		if (!project.hasProperty('withGl')) gametestRuntimeOnly project(':metallium-gl')
	}
	def dir = project.property('instance')
	loom.runs.clientGameTest {
		runDir((dir instanceof String && !dir.isEmpty() && dir != 'true') ? dir : 'run-instance')
		vmArg '-Dmetallium.gametest.mode=instance'
		if (project.hasProperty('instancePacks')) vmArg "-Dmetallium.gametest.instancePacks=${project.property('instancePacks')}"
		// Real crash recovery across runs (normally off in game tests); the later -D wins over the default above.
		if (project.hasProperty('instanceCrashRecovery')) vmArg '-Dmetallium.crashRecovery=on'
	}
	// Fabric's game-test setup wipes the run directory before each run; the instance copy must survive.
	tasks.matching { it.name == 'deleteGameTestRunDir' }.configureEach { enabled = false }
}

// ./gradlew :runClient -Pplay[=dir]  → play the real instance by hand (tools/make-run-instance.sh <src> play-instance):
// its mods load from <dir>/mods, plus the dev Metallium, metallium-iris and metallium-gl. Default dir: metallium-research/play-instance (outside the repo; never commit instance data).
if (project.hasProperty('play')) {
	dependencies {
		localRuntime project(':metallium-iris')
		if (!project.hasProperty('withGl')) localRuntime project(':metallium-gl')
	}
	def dir = project.property('play')
	loom.runs.client {
		runDir((dir instanceof String && !dir.isEmpty() && dir != 'true') ? dir : '../metallium-research/play-instance')
	}
}

// Mod-compat game-test variants (Sodium + the mod; one Minecraft run each):
//   ./gradlew runClientGameTest -PwithReGlass | -PwithCullLeaves | -PwithMoreCulling
// Cull Leaves and More Culling are mutually exclusive in one run.
if (project.hasProperty('withReGlass') || project.hasProperty('withCullLeaves') || project.hasProperty('withMoreCulling')) {
	if (project.hasProperty('withCullLeaves') && project.hasProperty('withMoreCulling')) {
		throw new GradleException('-PwithCullLeaves and -PwithMoreCulling cannot be combined')
	}
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		if (project.hasProperty('withReGlass')) gametestRuntimeOnly 'maven.modrinth:reglass:lmGLWyTl' // 2.1.1 for 26.3 (version numbers are shared across MC versions, so use the id)
		if (project.hasProperty('withCullLeaves')) gametestRuntimeOnly 'maven.modrinth:cull-leaves:jqOVPlQ8'
		if (project.hasProperty('withMoreCulling')) {
			gametestRuntimeOnly 'maven.modrinth:moreculling:t7vAlfgO'
			gametestRuntimeOnly 'maven.modrinth:cloth-config:fg2uyxOW' // required dependency of More Culling
		}
	}
}

// ./gradlew runClientGameTest -PwithDH  → Sodium + Distant Horizons 3.3.4 (26.3, fabric).
if (project.hasProperty('withDH')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		gametestRuntimeOnly 'maven.modrinth:distanthorizons:TGgEbP9A'
	}
}

// ./gradlew runClientGameTest -PwithBobby  → Bobby 5.2.16 (client-side chunk cache, LGPL-3.0; test-only runtime
// dependency). Alone (vanilla renderer) or with -PwithSodium / -PwithVoxy=<jar> -PwithGl.
if (project.hasProperty('withBobby')) {
	dependencies {
		gametestRuntimeOnly 'maven.modrinth:bobby:J7YnfCss' // 5.2.16+mc26.3
	}
}

// ./gradlew runClientGameTest -PwithVoxy=/abs/path/voxy-26.3.jar  → Sodium + a locally built Voxy (branch 263).
// There is no 26.3 Voxy on Modrinth yet and Voxy is all-rights-reserved: the jar is never committed or redistributed.
if (project.hasProperty('withVoxy')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		gametestRuntimeOnly files(project.property('withVoxy'))
		// The 263 Voxy build bundles RocksDB / LWJGL-zstd without macOS natives (its storage fails on world join):
		// dev-only natives from Maven Central so the test can create Voxy's world storage on macOS.
		gametestRuntimeOnly 'org.rocksdb:rocksdbjni:10.2.1'
		gametestRuntimeOnly 'org.lwjgl:lwjgl-zstd:3.4.1:natives-macos-arm64'
	}
}

// ./gradlew runClientGameTest -PwithPhysics=/abs/path/physics-mod-3.2.5-mc-26.3-fabric.jar  → Physics Mod scenario
// (PhysicsScenario: "needs OpenGL" screen or Metal, block debris, ragdolls, explosion). Physics Mod is closed source and
// all rights reserved: the jar is only loaded from the given path at test time, never committed or redistributed.
// Its only dependency (Fabric API) is already in the game-test runtime. Add -PwithGl to also route its raw GL calls.
if (project.hasProperty('withPhysics')) {
	def physicsJar = project.property('withPhysics')
	if (!(physicsJar instanceof String) || physicsJar.isEmpty() || physicsJar == 'true' || !file(physicsJar).isFile()) {
		throw new GradleException('-PwithPhysics needs the path of a Physics Mod jar, e.g. -PwithPhysics=/abs/physics-mod-3.2.5-mc-26.3-fabric.jar')
	}
	dependencies {
		gametestRuntimeOnly files(physicsJar)
	}
	loom.runs.clientGameTest {
		vmArg '-Dmetallium.gametest.mode=physics'
		// -PphysicsBench: FPS of each GPU feature scene with the feature on and off (run under gpu-lock.sh --exclusive)
		if (project.hasProperty('physicsBench')) vmArg '-Dmetallium.gametest.physicsBench=true'
	}
}

// ./gradlew runClientGameTest -PwithBetterF3=/abs/path/BetterF3-20.0.0-Fabric-26.3.jar  -> BetterF3 scenario (F3 overlay
// shows the Metallium lines through BetterF3's own HUD). BetterF3 is MIT; the jar is only loaded from the given path at
// test time. It needs Cloth Config (Modrinth, test-only). Combine with -PwithIris for the Iris adapter status line.
if (project.hasProperty('withBetterF3')) {
	def betterF3Jar = project.property('withBetterF3')
	if (!(betterF3Jar instanceof String) || betterF3Jar.isEmpty() || betterF3Jar == 'true' || !file(betterF3Jar).isFile()) {
		throw new GradleException('-PwithBetterF3 needs the path of a BetterF3 jar, e.g. -PwithBetterF3=/abs/BetterF3-20.0.0-Fabric-26.3.jar')
	}
	dependencies {
		gametestRuntimeOnly files(betterF3Jar)
		gametestRuntimeOnly 'maven.modrinth:cloth-config:fg2uyxOW'
	}
	loom.runs.clientGameTest {
		vmArg '-Dmetallium.gametest.mode=betterf3'
	}
}

// ./gradlew runClientGameTest -PwithGl -PcrashRecovery  → simulates "the last session crashed in a metallium-gl-routed
// mod": seeds a session marker and a crash report into the run directory, so this run must start on OpenGL and show the
// crash-recovery screen before the title screen.
if (project.hasProperty('crashRecovery')) {
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		doFirst {
			def run = file('build/run/clientGameTest')
			def start = System.currentTimeMillis() - 60_000
			file("$run/config/metallium").mkdirs()
			file("$run/config/metallium/session.json").text = """{"start": $start, "engine": "METAL", "routed": [{"id": "metallium-gametest", "name": "Metallium client game tests", "packages": ["dev.metallium.gametest.gl"]}]}"""
			file("$run/crash-reports").mkdirs()
			file("$run/crash-reports/crash-simulated-client.txt").text = '---- Minecraft Crash Report ----\n' +
					'Description: Rendering overlay (simulated by -PcrashRecovery)\n\n' +
					'java.lang.UnsupportedOperationException: metallium-gl: unimplemented GL11.glAccum(IF)V (called by metallium-gametest)\n' +
					'\tat dev.metallium.gl.MetalGLLog.unimplemented(MetalGLLog.java:44)\n' +
					'\tat dev.metallium.gametest.gl.RawGlQuads.render(RawGlQuads.java:1)\n'
		}
	}
}

// ./gradlew releaseJar  -> build/release/metallium-<version>.jar: the single installable alpha jar (see docs/RELEASE.md).
tasks.register('releaseJar', Copy) {
	group = 'build'
	description = 'Builds the single installable Metallium jar (core + metallium-gl + metallium-iris + metal-jvm, jar-in-jar).'
	from(tasks.named('jar'))
	into layout.buildDirectory.dir('release')
}

// ./gradlew runClientGameTest -PreleaseJarTest  -> runs the game test against build/release/metallium-<version>.jar installed as a
// mod (jar-in-jar metallium-gl + metallium-iris included) instead of the dev classes of the root project and subprojects.
// -PreleaseJarSodium / -PreleaseJarIris add Sodium (+ Iris) as ordinary mods next to the jar.
if (project.hasProperty('releaseJarTest')) {
	def releaseJarFile = layout.buildDirectory.file("release/metallium-${project.version}.jar").get().asFile
	if (project.hasProperty('releaseJarSodium') || project.hasProperty('releaseJarIris')) {
		dependencies {
			gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
			if (project.hasProperty('releaseJarIris')) gametestRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
		}
	}
	afterEvaluate {
		def mainClasses = sourceSets.main.output.files
		sourceSets.gametest.runtimeClasspath = sourceSets.gametest.output +
				configurations.gametestRuntimeClasspath.filter { f -> !mainClasses.contains(f) } +
				files(releaseJarFile)
	}
	tasks.matching { it.name == 'runClientGameTest' }.configureEach { dependsOn 'releaseJar' }
}

// ./gradlew runClientProd  -> production-style Fabric launch (fabric.development unset) of the play instance, for mods that
// refuse Loom dev environments (Essential: "Failed to find tiny mappings file"). Metallium is the release jar
// (build/release/metallium-<v>.jar, added with -Dfabric.addMods, includes metallium-gl + metallium-iris), not dev classes.
// The instance (../metallium-research/play-instance by default, or -PplayProd=<dir>) supplies the other mods. Offline user, no login.
tasks.register('runClientProd', JavaExec) {
	dependsOn 'releaseJar'
	def dirProp = project.findProperty('playProd')
	def instDir = file((dirProp instanceof String && !dirProp.isEmpty() && dirProp != 'true') ? dirProp : '../metallium-research/play-instance')
	def rel = layout.buildDirectory.file("release/metallium-${project.version}.jar").get().asFile
	workingDir = instDir
	classpath = files(configurations.runtimeClasspath.filter { !it.name.startsWith('metal-jvm') })
	mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
	jvmArgs '--enable-native-access=ALL-UNNAMED', '-XstartOnFirstThread', '-Xmx6G', "-Dfabric.addMods=${rel}"
	args '--username', 'Player', '--version', 'Metallium-play', '--gameDir', instDir.absolutePath,
		'--assetsDir', "${System.getProperty('user.home')}/.gradle/caches/fabric-loom/assets", '--assetIndex', '26.3-34',
		'--accessToken', '0', '--userType', 'legacy'
	doFirst { if (!rel.exists()) throw new GradleException("missing $rel") }
}
