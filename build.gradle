plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'metallium'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Sodium is optional at runtime; compiled against for the options page.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"

	include(implementation("io.github.kokodio:metal-jvm:${project.metal_jvm_version}"))

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// shaderc / SPIRV-Cross natives for unit tests (the game provides them at runtime).
	['natives-linux', 'natives-macos-arm64', 'natives-macos'].each { classifier ->
		testRuntimeOnly "org.lwjgl:lwjgl:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-spvc:3.4.3:${classifier}"
	}
}

test {
	useJUnitPlatform()
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE')
	from('NOTICE')
	from('LICENSES') { into 'LICENSES' }
}

// Standalone Metal smoke test (no Minecraft): ./gradlew metalSmokeTest  — macOS only.
sourceSets {
	smoketest {
		java.srcDir 'src/smoketest/java'
	}
}

dependencies {
	smoketestImplementation "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"
}

tasks.register('metalSmokeTest', JavaExec) {
	group = 'verification'
	description = 'Creates a Metal device, renders offscreen and checks the result (macOS only).'
	classpath = sourceSets.smoketest.runtimeClasspath
	mainClass = 'dev.metallium.smoketest.MetalSmokeTest'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Client game tests (real game, real window): ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'metallium-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom.runs.clientGameTest {
	vmArg '-Xmx4G'
	vmArg '--enable-native-access=ALL-UNNAMED'
	vmArg "-Dmetallium.gametest.expectBackend=${System.getenv('METALLIUM_EXPECT_BACKEND') ?: ''}"
	if (project.hasProperty('bench')) vmArg '-Dmetallium.gametest.mode=bench'
	if (project.hasProperty('engine')) vmArg "-Dmetallium.engine=${project.property('engine')}"
	if (project.hasProperty('backendOff')) vmArg '-Dmetallium.backend=off'
	// -Pshaderpack=/abs/path/pack.zip (with -PwithIris): also load that pack in the game test. Copied into the run
	// directory at runtime only; never commit third-party packs.
	if (project.hasProperty('shaderpack')) vmArg "-Dmetallium.gametest.shaderpack=${project.property('shaderpack')}"
	if (project.hasProperty('benchSeconds')) vmArg "-Dmetallium.bench.seconds=${project.property('benchSeconds')}"
	if (project.hasProperty('benchScene')) vmArg "-Dmetallium.bench.scene=${project.property('benchScene')}"
	if (project.hasProperty('perfCounters')) vmArg '-Dmetallium.perfCounters=true'
	if (project.hasProperty('benchPower')) vmArg '-Dmetallium.bench.power=true'
	// A crashed earlier test run must not put the next one into crash-recovery mode (OpenGL + dialog).
	vmArg "-Dmetallium.crashRecovery=${project.hasProperty('crashRecovery') ? 'on' : 'off'}"
	if (project.hasProperty('playSeconds')) vmArg "-Dmetallium.gametest.playSeconds=${project.property('playSeconds')}"
	// The run directory is recreated for every game test, so keep the shader cache next to it: the second run is warm.
	// -PshaderCache=false disables it; delete that directory for a cold run.
	vmArg "-Dmetallium.shaderCache.dir=${layout.buildDirectory.get().asFile}/run/metallium-shader-cache"
	if (project.hasProperty('shaderCache')) vmArg "-Dmetallium.shaderCache=${project.property('shaderCache')}"
}

// ./gradlew runClientGameTest -PwithSodium  → runs the game tests with Sodium loaded.
if (project.hasProperty('withSodium')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		// also for ./gradlew runClient -PwithSodium (dev runtime only, not published)
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
}

// ./gradlew runClientGameTest -PwithIris  → Sodium + Iris + the Metallium Iris adapter.
if (project.hasProperty('withIris')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		gametestRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
		gametestRuntimeOnly project(':metallium-iris')
		// also for ./gradlew :runClient -PwithIris (dev runtime only)
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
		localRuntime "maven.modrinth:iris:${project.iris_version}"
		localRuntime project(':metallium-iris')
	}
}

// ./gradlew runClientGameTest -PwithGl  → also loads metallium-gl; the gametest's raw-GL test mod is retargeted to Metal.
if (project.hasProperty('withGl')) {
	dependencies {
		gametestRuntimeOnly project(':metallium-gl')
		localRuntime project(':metallium-gl')
	}
}

// Mod-compat game-test variants (Sodium + the mod; one Minecraft run each):
//   ./gradlew runClientGameTest -PwithReGlass | -PwithCullLeaves | -PwithMoreCulling
// Cull Leaves and More Culling are mutually exclusive in one run.
if (project.hasProperty('withReGlass') || project.hasProperty('withCullLeaves') || project.hasProperty('withMoreCulling')) {
	if (project.hasProperty('withCullLeaves') && project.hasProperty('withMoreCulling')) {
		throw new GradleException('-PwithCullLeaves and -PwithMoreCulling cannot be combined')
	}
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		if (project.hasProperty('withReGlass')) gametestRuntimeOnly 'maven.modrinth:reglass:lmGLWyTl' // 2.1.1 for 26.3 (version numbers are shared across MC versions, so use the id)
		if (project.hasProperty('withCullLeaves')) gametestRuntimeOnly 'maven.modrinth:cull-leaves:jqOVPlQ8'
		if (project.hasProperty('withMoreCulling')) {
			gametestRuntimeOnly 'maven.modrinth:moreculling:t7vAlfgO'
			gametestRuntimeOnly 'maven.modrinth:cloth-config:fg2uyxOW' // required dependency of More Culling
		}
	}
}

// ./gradlew runClientGameTest -PwithDH  → Sodium + Distant Horizons 3.3.4 (26.3, fabric).
if (project.hasProperty('withDH')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		gametestRuntimeOnly 'maven.modrinth:distanthorizons:TGgEbP9A'
	}
}

// ./gradlew runClientGameTest -PwithVoxy=/abs/path/voxy-26.3.jar  → Sodium + a locally built Voxy (branch 263).
// There is no 26.3 Voxy on Modrinth yet and Voxy is all-rights-reserved: the jar is never committed or redistributed.
if (project.hasProperty('withVoxy')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
		gametestRuntimeOnly files(project.property('withVoxy'))
	}
}

// ./gradlew runClientGameTest -PwithGl -PcrashRecovery  → simulates "the last session crashed in a metallium-gl-routed
// mod": seeds a session marker and a crash report into the run directory, so this run must start on OpenGL and show the
// crash-recovery screen before the title screen.
if (project.hasProperty('crashRecovery')) {
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		doFirst {
			def run = file('build/run/clientGameTest')
			def start = System.currentTimeMillis() - 60_000
			file("$run/config/metallium").mkdirs()
			file("$run/config/metallium/session.json").text = """{"start": $start, "engine": "METAL", "routed": [{"id": "metallium-gametest", "name": "Metallium client game tests", "packages": ["dev.metallium.gametest.gl"]}]}"""
			file("$run/crash-reports").mkdirs()
			file("$run/crash-reports/crash-simulated-client.txt").text = '---- Minecraft Crash Report ----\n' +
					'Description: Rendering overlay (simulated by -PcrashRecovery)\n\n' +
					'java.lang.UnsupportedOperationException: metallium-gl: unimplemented GL11.glAccum(IF)V (called by metallium-gametest)\n' +
					'\tat dev.metallium.gl.MetalGLLog.unimplemented(MetalGLLog.java:44)\n' +
					'\tat dev.metallium.gametest.gl.RawGlQuads.render(RawGlQuads.java:1)\n'
		}
	}
}
