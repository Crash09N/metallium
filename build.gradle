plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'metallium'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Sodium is optional at runtime; compiled against for the options page.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"

	include(implementation("io.github.kokodio:metal-jvm:${project.metal_jvm_version}"))

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// shaderc / SPIRV-Cross natives for unit tests (the game provides them at runtime).
	['natives-linux', 'natives-macos-arm64', 'natives-macos'].each { classifier ->
		testRuntimeOnly "org.lwjgl:lwjgl:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-spvc:3.4.3:${classifier}"
	}
}

test {
	useJUnitPlatform()
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE')
	from('LICENSES') { into 'LICENSES' }
}

// Standalone Metal smoke test (no Minecraft): ./gradlew metalSmokeTest  — macOS only.
sourceSets {
	smoketest {
		java.srcDir 'src/smoketest/java'
	}
}

dependencies {
	smoketestImplementation "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"
}

tasks.register('metalSmokeTest', JavaExec) {
	group = 'verification'
	description = 'Creates a Metal device, renders offscreen and checks the result (macOS only).'
	classpath = sourceSets.smoketest.runtimeClasspath
	mainClass = 'dev.metallium.smoketest.MetalSmokeTest'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Client game tests (real game, real window): ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'metallium-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom.runs.clientGameTest {
	vmArg '-Xmx4G'
	vmArg '--enable-native-access=ALL-UNNAMED'
	vmArg "-Dmetallium.gametest.expectBackend=${System.getenv('METALLIUM_EXPECT_BACKEND') ?: ''}"
}

// ./gradlew runClientGameTest -PwithSodium  → runs the game tests with Sodium loaded.
if (project.hasProperty('withSodium')) {
	dependencies {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
	}
}
