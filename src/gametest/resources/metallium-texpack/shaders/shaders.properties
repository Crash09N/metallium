# Metallium custom texture test pack (Apache-2.0, written for Metallium's game tests; the textures are generated test
# data). Checks custom textures and buffer sizes by pixels in the game test.
# A PNG replacing a built-in sampler in one stage.
texture.composite.colortex5 = stripes.png
# A raw 3D texture (Iris renames the sampler to customtex0); RGB half floats are widened to RGBA16F on Metal.
texture.composite.depthtex2 = volume.dat TEXTURE_3D RGB16F 2 2 2 RGB HALF_FLOAT
# The pack's own noise texture.
texture.noise = noise.png
# A buffer with an absolute size.
size.buffer.colortex4 = 64 32
