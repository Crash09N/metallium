# Nativium compute test pack (MIT, written for Nativium's game tests). Iris stage 5: compute passes, SSBOs,
# images (colorimg + custom 2D/3D images, atomics), mipmapped buffers, and SSBO/image/3D-sampler access from fullscreen
# fragment programs, checked by pixels in the game test.
iris.features.required = COMPUTE_SHADERS SSBO CUSTOM_IMAGES
# 32 bytes of fixed data + a runtime array of 8 uints (checked with .length()).
bufferObject.0 = 64
# A per-frame cleared 2D counter image (imageAtomicAdd from every pixel of composite.csh).
image.counterImg = counterSampler red_integer r32ui unsigned_int true false 4 4
# A persistent 3D image: setup.csh writes one green texel, composite2.fsh samples it through volumeSampler.
image.volumeImg = volumeSampler rgba rgba8 unsigned_byte false false 4 4 4
