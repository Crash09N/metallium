plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// metallium-gl: OpenGL -> Metal translation layer for mods that call LWJGL's GL directly. Apache-2.0 like the core.
version = project.mod_version
group = project.maven_group

base {
	archivesName = 'metallium-gl'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation project(':')
	// Bundled (jar-in-jar) by the core mod; needed here to compile against and for the unit tests.
	compileOnly "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"
	testImplementation "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// shaderc / SPIRV-Cross natives for unit tests (the game provides them at runtime).
	['natives-linux', 'natives-macos-arm64', 'natives-macos'].each { classifier ->
		testRuntimeOnly "org.lwjgl:lwjgl:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.4.3:${classifier}"
		testRuntimeOnly "org.lwjgl:lwjgl-spvc:3.4.3:${classifier}"
	}
}

test {
	useJUnitPlatform()
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file('LICENSE'))
	from(rootProject.file('NOTICE'))
}

// No standalone dev client; use the root project's runs (-PwithGl).
tasks.matching { it.name.startsWith('runClient') || it.name.startsWith('runServer') }.configureEach {
	enabled = false
}

// Static GL coverage scan of a mod corpus (developer tool; see docs/compat/gl-coverage.md):
//   ./gradlew :metallium-gl:glCoverage -PglCorpus=/path/to/jars[,more] [-PglCoverageOut=file.json]
tasks.register('glCoverage', JavaExec) {
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.metallium.gl.tools.GlCoverageScan'
	def out = project.findProperty('glCoverageOut') ?: layout.buildDirectory.file('gl-coverage.json').get().asFile.path
	def corpus = (project.findProperty('glCorpus') ?: '').toString().split(',').findAll { !it.isBlank() }
	args([out] + corpus)
}
