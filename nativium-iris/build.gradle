plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Iris adapter: separate mod and jar, licensed LGPL-3.0 because it adapts Iris internals.
version = project.mod_version
group = project.maven_group

base {
	archivesName = 'nativium-iris'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation project(':')
	// Voxy bridge (VoxyIrisBridge): GL names of the Metal textures for Voxy's shader-pack pipeline. Runtime: only used
	// when nativium-gl routes Voxy (then it is installed).
	compileOnly project(':nativium-gl')
	compileOnly "io.github.kokodio:metal-jvm:${project.metal_jvm_version}"
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE')
}

// The adapter has no standalone dev client (it needs Iris + Sodium); use the root project's runs (-PwithIris).
tasks.matching { it.name.startsWith('runClient') || it.name.startsWith('runServer') }.configureEach {
	enabled = false
}

// LGPL-3.0 source availability: the nested jar carries a pointer to the corresponding source.
jar {
	from(rootProject.file('nativium-iris/SOURCE.txt'))
}
