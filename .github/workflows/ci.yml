name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'NOTICE'
      - 'LICENSE*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: metallium-jar
          path: build/libs/*.jar

  metal:
    name: Metal smoke test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: GPU info
        run: system_profiler SPDisplaysDataType || true
      - name: Metal smoke test + translator tests (compiled with Metal)
        run: ./gradlew metalSmokeTest test --no-daemon

  client-gametest:
    name: Minecraft on Metal (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, sodium, iris]
    runs-on: macos-15
    needs: metal
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run client game test on Metal
        env:
          METALLIUM_EXPECT_BACKEND: Metal
        run: ./gradlew runClientGameTest --no-daemon ${{ matrix.variant == 'sodium' && '-PwithSodium' || matrix.variant == 'iris' && '-PwithIris' || '' }}
      - name: Report
        if: always()
        run: cat build/run/clientGameTest/metallium-gametest-report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-gametest-results-${{ matrix.variant }}
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/metallium-gametest-report.txt
          if-no-files-found: warn
      - name: Publish results to ci-artifacts branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out && cd ci-out
          cp -r ../build/run/clientGameTest/screenshots . 2>/dev/null || true
          cp ../build/run/clientGameTest/metallium-gametest-report.txt . 2>/dev/null || true
          cp ../build/run/clientGameTest/logs/latest.log . 2>/dev/null || true
          cp -r ../build/run/clientGameTest/crash-reports . 2>/dev/null || true
          echo "${GITHUB_SHA}" > COMMIT
          git init -q && git checkout -q -b "ci-artifacts-${{ matrix.variant }}" && git add -A
          git -c user.name=metallium-ci -c user.email=ci@users.noreply.github.com commit -qm "CI results for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-artifacts-${{ matrix.variant }}"
